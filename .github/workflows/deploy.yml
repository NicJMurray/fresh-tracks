name: Deploy Fresh Tracks
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: fresh-tracks-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: "22c1482ec05957092be7a2df424c4543"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check deployment access
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Set the encrypted CLOUDFLARE_API_TOKEN repository secret to enable automatic publishing."
            exit 1
          fi
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply fresh-tracks --remote
      - name: Deploy Worker and assets
        run: npx wrangler deploy --tag "git-$GITHUB_SHA"
