<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102720">
  <title>Fresh Tracks — Coming soon</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #102720;
      color: #f4f6e9;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      background: radial-gradient(ellipse at 50% 34%, #1c493b, transparent 65%);
    }

    main {
      padding: 2rem 1.25rem;
      text-align: center;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin: 0 0 1.75rem;
      color: #d8ef94;
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .mark {
      display: flex;
      align-items: center;
    }

    .mark::before, .mark::after {
      content: "";
      width: 0.8rem;
      height: 0.8rem;
      border: 2px solid currentColor;
      border-radius: 50%;
    }

    .mark::after {
      margin-left: -0.38rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.75rem, 9vw, 6rem);
      line-height: 1.05;
      letter-spacing: -0.065em;
    }

    .message {
      margin: 1.15rem 0 0;
      color: #c5d7cc;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>
  <main>
    <p class="brand"><span class="mark" aria-hidden="true"></span>Fresh Tracks</p>
    <h1>Coming soon</h1>
    <p class="message">Fresh Tracks is being rebuilt.</p>
  </main>
</body>
</html>
